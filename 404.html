<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not found | 404</title>
    <style>
        :root {
            --primary-color: #007bff;
            --text-color: #333;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 120px;
            margin: 0;
            color: var(--primary-color);
            line-height: 1;
        }

        p {
            font-size: 20px;
            margin: 20px 0 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-home {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-tg {
            background-color: #24A1DE;
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            h1 { font-size: 80px; }
            p { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <p>It appears that this page has been lost or does not exist.</p>
        
        <div class="btn-group">
            <a href="https://ra1ntop.github.io/MyBio/" class="btn btn-home">Home</a>
        </div>
    </div>

</body>
</html>
